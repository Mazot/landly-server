services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: landly_minio
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ../minio.license:/minio.license:ro
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: landly_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/landly-images &&
        mc anonymous set public local/landly-images &&
        echo 'AIStor bucket landly-images ready.'
      "
    networks:
      - test_network

networks:
  test_network:
    driver: bridge

volumes:
  minio_data:
