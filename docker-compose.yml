services:
  db:
    image: postgres:17-alpine
    container_name: landly_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landly-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landly-password}
      POSTGRES_DB: ${POSTGRES_DB:-landly}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - landly_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landly-user} -d ${POSTGRES_DB:-landly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    container_name: landly_redis_cache
    environment:
      REDIS_USER: ${REDIS_USER:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-pass}
    command: >
      sh -c '
        echo "user ${REDIS_USER:-redis} on +@all ~* >${REDIS_PASSWORD:-redis-pass}" > /tmp/users.acl &&
        redis-server --appendonly yes --aclfile /tmp/users.acl --requirepass ${REDIS_PASSWORD:-redis-pass}
      '
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - landly_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  minio:
    image: quay.io/minio/minio:latest
    container_name: landly_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - landly_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: landly_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${S3_BUCKET:-landly-images} &&
        mc anonymous set public local/${S3_BUCKET:-landly-images} &&
        echo 'MinIO bucket ${S3_BUCKET:-landly-images} is ready.'
      "
    networks:
      - landly_network

  landly-server:
    build: .
    container_name: landly_server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-landly-user}:${POSTGRES_PASSWORD:-landly-password}@db:5432/${POSTGRES_DB:-landly}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://orsoft.xyz}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      REDIS_URL: redis://${REDIS_USER:-redis}:${REDIS_PASSWORD:-redis-pass}@redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-landly-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/landly-images}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${EXTERNAL_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - landly_network
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  landly_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
