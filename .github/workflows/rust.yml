name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Throw-away services for the DB/Redis-backed tests (src/test_support.rs);
    # without them those tests skip themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: landly
          POSTGRES_PASSWORD: landly
          POSTGRES_DB: landly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U landly -d landly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://landly:landly@localhost:5432/landly_test
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # scripts/crates is a separate workspace that links the main crate as a
  # library; it is NOT covered by the root build and silently breaks when
  # structs in src/data/models.rs change.
  scripts-workspace:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: scripts/crates
    - name: Build scripts workspace
      run: cargo build --verbose
      working-directory: scripts/crates

  coverage:
    runs-on: ubuntu-latest
    # Throw-away services for the DB/Redis-backed tests (src/test_support.rs);
    # without them those tests skip themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: landly
          POSTGRES_PASSWORD: landly
          POSTGRES_DB: landly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U landly -d landly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://landly:landly@localhost:5432/landly_test
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
    - name: Generate coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
